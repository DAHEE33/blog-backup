name: Tistory to GitHub Sync

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install feedparser
      
      - name: Create fetch script
        run: |
          cat > fetch_tistory.py << 'EOF'
          import feedparser
          import os
          
          # Secrets에서 주소를 가져오되, /rss가 없으면 자동으로 붙여줍니다.
          RAW_URL = os.environ.get('TISTORY_RSS_URL', '')
          RSS_URL = RAW_URL if RAW_URL.endswith('/rss') else RAW_URL.rstrip('/') + '/rss'
          
          def fetch_and_save():
              if not RAW_URL:
                  print("TISTORY_RSS_URL is not set!")
                  return
              
              print(f"📡 Fetching from: {RSS_URL}")
              feed = feedparser.parse(RSS_URL)
              
              if not feed.entries:
                  print("❌ 가져올 포스트가 없습니다. RSS 주소를 확인해주세요.")
                  return

              posts_dir = 'posts'
              os.makedirs(posts_dir, exist_ok=True)
              
              for entry in feed.entries:
                  title = entry.title
                  link = entry.link
                  published = entry.get('published', entry.get('updated', ''))
                  content = entry.get('description', entry.get('summary', '내용 없음'))
                  
                  safe_title = "".join(c for c in title if c.isalnum() or c in (' ', '-', '_')).strip()[:50]
                  filename = f"{safe_title}.md"
                  filepath = os.path.join(posts_dir, filename)
                  
                  # 파일 내용 생성
                  post_content = f"# {title}\n\n**발행일:** {published}\n\n**링크:** {link}\n\n---\n\n{content}"
                  
                  # (선택 사항) 기존 파일이 있다면 내용을 읽어서 비교할 수도 있지만,
                  # Git은 파일 내용이 같으면 '변경 없음'으로 인식하므로 덮어써도 괜찮습니다.
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(post_content)
              
              print(f"✅ {len(feed.entries)}개의 포스트가 성공적으로 동기화되었습니다!")

          if __name__ == '__main__':
              fetch_and_save()
          EOF
      
      - name: Run sync script
        env:
          TISTORY_RSS_URL: ${{ secrets.TISTORY_RSS_URL }}
        run: python fetch_tistory.py
      
      # [핵심 변경 부분] 변경사항이 있을 때만 커밋/푸시
      - name: Commit and push changes
        run: |
          git config --local user.email "todaykim10@gmail.com"
          git config --local user.name "DAHEE33"
          git add .
          
          # 'git diff --staged --quiet'는 변경사항이 없으면 0(성공), 있으면 1(실패)을 반환합니다.
          if git diff --staged --quiet; then
            echo "🚫 변경된 포스트가 없습니다. 커밋하지 않습니다."
          else
            echo "✅ 새로운 포스트가 감지되었습니다. 커밋을 진행합니다."
            git commit -m "📝 티스토리 포스트 동기화: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
